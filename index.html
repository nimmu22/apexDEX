<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Single File Web Page</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 1rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    button {
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .counter-display {
      margin-top: 1.5rem;
      font-size: 1.125rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Hello, World!</h1>
    <p>This is a complete, self-contained HTML document featuring embedded CSS and JavaScript.</p>
    <button id="actionBtn">Click Me</button>
    <div class="counter-display" id="countDisplay">Clicks: 0</div>
  </main>

  <script>
    let clicks = 0;
    const button = document.getElementById('actionBtn');
    const display = document.getElementById('countDisplay');

    button.addEventListener('click', () => {
      clicks++;
      display.textContent = `Clicks: ${clicks}`;
    });
  </script>

</body>
</html>
